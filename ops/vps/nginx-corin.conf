# Corin Commercial, installed by ops/vps/setup.sh as /etc/nginx/sites-available/corin.conf.
# Serves corincommercial.com and the express-funnel domain, and answers on the
# server's bare IP for testing before DNS moves. tls.sh (certbot) adds HTTPS
# and the HTTP-to-HTTPS redirect to this file once the domains point here.
# Other sites get their own file in /etc/nginx/sites-available.

upstream corin_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name corincommercial.com www.corincommercial.com kubera.loans www.kubera.loans _;

    # Borrower uploads go up to 50 MB (lib/checklists/uploads.ts MAX_UPLOAD_BYTES).
    client_max_body_size 55m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Hashed build assets straight from disk.
    location /_next/static/ {
        alias /srv/corin/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://corin_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # nginx is the edge: replace, never append, so clients cannot forge their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Pages stream (Partial Prerendering); pass chunks through as they arrive.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
